<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>IB 학습자상 퀘스트 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .secret-msg { display: none; transition: all 0.5s; }
        .show { display: block; animation: bounce 1s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border-t-8 border-blue-500">
        <h1 class="text-2xl font-extrabold text-center text-gray-800 mb-6">IB 퀘스트 마스터 🏆</h1>
        
        <div class="bg-blue-50 p-4 rounded-xl mb-6 flex justify-between items-center border border-blue-100">
            <div>
                <p id="rankDisplay" class="text-sm font-bold text-blue-600">등급: 🐣 수습 사서</p>
                <p id="scoreDisplay" class="text-2xl font-black text-blue-800">0 pt</p>
            </div>
            <div id="badgeIcon" class="text-4xl">🌱</div>
        </div>

        <div id="secretArea" class="secret-msg bg-yellow-100 p-3 rounded-lg mb-4 border-2 border-dashed border-yellow-400 text-center text-sm font-bold text-yellow-700">
            🔓 비밀 미션 해제: 사서 선생님께 가서 <br> "탐구는 나의 힘!"이라고 외치고 간식을 받으세요!
        </div>

        <div class="space-y-3 mb-6">
            <select id="learnerProfile" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-400 outline-none transition">
                <option value="탐구하는 사람">🔍 탐구하는 사람</option>
                <option value="지식이 많은 사람">📖 지식이 많은 사람</option>
                <option value="생각하는 사람">💡 생각하는 사람</option>
                <option value="소통하는 사람">🗣️ 소통하는 사람</option>
                <option value="원칙을 지키는 사람">⚖️ 원칙을 지키는 사람</option>
            </select>
            <input type="text" id="bookTitle" placeholder="읽은 도서 제목" class="w-full p-3 border-2 border-gray-200 rounded-lg">
            <textarea id="actionIdea" placeholder="당신의 실천 아이디어는?" class="w-full p-3 border-2 border-gray-200 rounded-lg h-24"></textarea>
            <button onclick="addQuest()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-lg shadow-lg active:scale-95 transition">실천 기록하기 (+100)</button>
        </div>

        <div class="border-t pt-4">
            <h3 class="font-bold text-gray-700 mb-3 text-sm">최근 나의 실천 로그</h3>
            <ul id="questList" class="space-y-3"></ul>
        </div>
    </div>

    <script>
        let totalScore = parseInt(localStorage.getItem('ibScore')) || 0;

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = `${totalScore} pt`;
            
            let rank = "🐣 수습 사서";
            let icon = "🌱";
            
            if (totalScore >= 600) {
                rank = "👑 전설의 사서";
                icon = "🔥";
            } else if (totalScore >= 300) {
                rank = "📚 숙련된 사서";
                icon = "🌿";
            }
            
            document.getElementById('rankDisplay').innerText = `등급: ${rank}`;
            document.getElementById('badgeIcon').innerText = icon;

            // 비밀 메시지 로직: 500점 이상일 때 노출
            if (totalScore >= 500) {
                document.getElementById('secretArea').classList.add('show');
            }
        }

        function addQuest() {
            const profile = document.getElementById('learnerProfile').value;
            const book = document.getElementById('bookTitle').value;
            const action = document.getElementById('actionIdea').value;

            if(!book || !action) {
                alert("내용을 모두 입력해 주세요!");
                return;
            }

            totalScore += 100;
            localStorage.setItem('ibScore', totalScore);

            const list = document.getElementById('questList');
            const item = document.createElement('li');
            item.className = "bg-gray-50 p-3 rounded-lg border text-sm";
            item.innerHTML = `<strong>[${profile}]</strong> ${book}<br><span class="text-gray-500">${action}</span>`;
            list.prepend(item);

            updateUI();
            document.getElementById('bookTitle').value = '';
            document.getElementById('actionIdea').value = '';
        }

        // 초기 화면 설정
        updateUI();
    </script>
</body>
</html>
